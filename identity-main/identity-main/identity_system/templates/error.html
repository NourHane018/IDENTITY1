<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - University System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .error-card {
            background: white;
            border-radius: 25px;
            max-width: 500px;
            width: 100%;
            padding: 45px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }
        
        .error-icon {
            font-size: 65px;
            color: #e53e3e;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #e53e3e;
            margin-bottom: 15px;
            font-size: 28px;
        }
        
        .error-message {
            color: #718096;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .error-details {
            background: #fed7d7;
            color: #c53030;
            padding: 18px;
            border-radius: 12px;
            margin: 25px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
            text-align: left;
            border-left: 4px solid #c53030;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 28px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-block;
            font-size: 14px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #718096;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #4a5568;
        }
        
        @media (max-width: 640px) {
            .error-card {
                padding: 30px;
            }
            
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">⚠️</div>
        <h1>Oops! Something went wrong</h1>
        <p class="error-message">We encountered an error while processing your request.</p>
        
        <div class="error-details">{{ error }}</div>
        
        <div class="btn-group">
            <a href="/" class="btn btn-primary">🏠 Go Home</a>
            <a href="javascript:history.back()" class="btn btn-secondary">🔙 Go Back</a>
        </div>
    </div>
</body>
</html>
